[package]
name = "idl-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generate a SPEL IDL JSON from a guest source file (vendored from logos-blockchain/lez-programs, MIT)"

[lints]
workspace = true

[[bin]]
name = "idl-gen"
path = "src/main.rs"

[dependencies]
spel-framework-core = { git = "https://github.com/logos-co/spel.git", rev = "1ef0500f8fc8ce3ddf95523726ae159db83f744f", package = "spel-framework-core", features = ["idl-gen"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
