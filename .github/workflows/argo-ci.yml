name: Argo CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: argo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build once, reuse: the same Rust + risc0 + system-deps image LEZ CI runs in.
  ci-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  lint:
    needs: ci-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (guests are linted through their host crates; RISC0_SKIP_BUILD skips the guest build here)
        run: RISC0_SKIP_BUILD=1 cargo clippy --locked --workspace --all-targets -- -D warnings

  unit:
    needs: ci-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RISC0_DEV_MODE: "1"
      RISC0_BUILD_LOCKED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: lockfiles are current (root + both guest workspaces)
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 --manifest-path programs/argo_lending/methods/guest/Cargo.toml >/dev/null
          cargo metadata --locked --format-version 1 --manifest-path spikes/vault/methods/guest/Cargo.toml >/dev/null
      - name: pure crates (host)
        run: cargo nextest run --locked -p argo_core -p irm_core
      - name: guest builds for riscv32 (guest lockfiles enforced via RISC0_BUILD_LOCKED)
        run: cargo build --locked --release -p argo_lending_methods -p spike_vault_methods
      - name: IDL is up to date
        run: ./harness/gen-idl.sh && git diff --exit-code -- idl/

  # Full loop against a locally booted STANDALONE sequencer. Never touches the
  # public testnet. RISC0_DEV_MODE=1 so CI finishes in minutes; real proofs are
  # a separate, documented run.
  e2e-localnet:
    needs: ci-image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RISC0_DEV_MODE: "1"
      RISC0_BUILD_LOCKED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: harness smoke (boot sequencer, deploy placeholder, read back)
        run: ./harness/localnet.sh smoke
      - name: spikes (all five; a spike that fails to run or whose decisive tests fail exits non-zero)
        run: ./spikes/run.sh all
      - name: committed spike captures match this run (test lists byte-identical; cycle table within 0.5%, see docs/m0/riscv32-build.md)
        run: |
          git diff --exit-code -- evidence/localnet/S-A.run.txt evidence/localnet/S-B.run.txt
          git show HEAD:evidence/localnet/S-D.run.txt > /tmp/S-D.committed.txt
          python3 harness/compare-cycles.py /tmp/S-D.committed.txt evidence/localnet/S-D.run.txt
      - name: sequencer log (on failure)
        if: failure()
        shell: bash
        run: tail -150 .localnet-argo/seq.log 2>/dev/null || true
